<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laporan & Tabel</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#18243b;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;padding:14px}.panel{background:#fff;border:1px solid #e1e8f2;border-radius:14px;padding:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select,.toolbar button{border:1px solid #d6dfed;border-radius:9px;padding:9px 10px;background:#fff;font:inherit;color:inherit}.toolbar button{cursor:pointer}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:800px;font-size:12px}th,td{padding:10px;border-bottom:1px solid #e8edf5;text-align:left}th{background:#f7f9fc;color:#64738a;position:sticky;top:0}.status{border-radius:99px;padding:4px 7px;background:#e7f7ec;color:#166534}.status.cancelled{background:#f1f3f7;color:#667085}.meta{font-size:12px;color:#66758c;line-height:1.5;margin-top:12px}.buttons{display:flex;gap:8px;flex-wrap:wrap}.buttons button{border:1px solid #d6dfed;border-radius:9px;background:#fff;padding:9px 10px;cursor:pointer}@media(max-width:500px){body{padding:8px}.panel{padding:10px}}
</style></head><body><section class="panel"><div class="toolbar"><input id="search" placeholder="Cari mapel, kelas, guru…"><select id="status"><option value="ALL">Semua status</option><option value="scheduled">Terjadwal</option><option value="cancelled">Dibatalkan</option></select><select id="type"><option value="ALL">Semua jenis</option><option value="written">Tertulis</option><option value="practical">Praktik</option></select><div class="buttons"><button id="csv">Ekspor CSV</button><button id="print">Cetak</button></div></div><div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Kelas</th><th>Mapel</th><th>Guru</th><th>Nomor</th><th>Jenis</th><th>Waktu</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="rows"></tbody></table></div><div id="count" class="meta"></div><p class="meta">Pembatalan mengubah status menjadi <code>cancelled</code> dan mempertahankan riwayat. Persistensi mengikuti mode aplikasi yang aktif.</p></section>
<script>
(()=>{const ns="ZIESORRA_SUMATIF_BRIDGE",pending=new Map();let seq=0,records=[];const $=id=>document.getElementById(id);const classes={"class-1a":"Kelas 1-A","class-2a":"Kelas 2-A","class-3a":"Kelas 3-A","class-4b":"Kelas 4-B","class-5a":"Kelas 5-A","class-5b":"Kelas 5-B"};function req(type,payload={}){return new Promise(resolve=>{const id="rep-"+(++seq);pending.set(id,resolve);parent.postMessage({namespace:ns,type,requestId:id,payload},location.origin);setTimeout(()=>{if(pending.has(id)){pending.delete(id);resolve({ok:false})}},2500)})}window.addEventListener("message",e=>{if(e.origin!==location.origin||e.source!==parent)return;const m=e.data;if(!m||m.namespace!==ns)return;if(m.type==="RESPONSE"&&m.payload?.requestId){pending.get(m.payload.requestId)?.(m.payload.result);pending.delete(m.payload.requestId)}if(m.type==="STORE_CHANGED")load()});async function load(){const r=await req("GET_SCHEDULES");if(r.ok){records=r.schedules||[];render()}}function filtered(){const q=$("search").value.toLowerCase();return records.filter(s=>($("status").value==="ALL"||s.status===$("status").value)&&($("type").value==="ALL"||s.assessmentType===$("type").value)&&[s.subject,s.teacher,s.classId,classes[s.classId],s.material,s.date].some(v=>String(v||"").toLowerCase().includes(q)))}function render(){const root=$("rows");root.replaceChildren();const list=filtered().sort((a,b)=>a.date.localeCompare(b.date));$("count").textContent=list.length+" dari "+records.length+" jadwal";list.forEach(s=>{const tr=document.createElement("tr");tr.dataset.scheduleId=s.id;const vals=[s.date,s.className||classes[s.classId]||s.classId,s.subject,s.teacher,"Sumatif "+s.sumatifNumber,s.assessmentType==="practical"?"Praktik":"Tertulis",(s.startTime||"—")+"–"+(s.endTime||"—")];vals.forEach(v=>{const td=document.createElement("td");td.textContent=v||"—";tr.append(td)});const status=document.createElement("td");const pill=document.createElement("span");pill.className="status "+(s.status==="cancelled"?"cancelled":"");pill.textContent=s.status;status.append(pill);tr.append(status);const action=document.createElement("td");if(s.status!=="cancelled"){const button=document.createElement("button");button.textContent="Batalkan";button.style.cssText="border:1px solid #f0c7c7;background:#fff5f5;color:#9c2626;padding:6px 8px;border-radius:7px;cursor:pointer";button.onclick=async()=>{if(!confirm("Batalkan jadwal "+s.subject+" tanggal "+s.date+"?"))return;const result=await req("CANCEL_SCHEDULE",{id:s.id});if(!result.ok){alert(result.error||"Gagal membatalkan jadwal.");return;}const index=records.findIndex(row=>row.id===s.id);if(index>=0)records[index]={...records[index],...result.record};render();};action.append(button)}else action.textContent="—";tr.append(action);root.append(tr)})}function csvEscape(v){return '"'+String(v??"").replaceAll('"','""')+'"'}$("csv").onclick=()=>{const rows=[["ID","Tanggal","Kelas","Mata pelajaran","Guru","Nomor Sumatif","Jenis","Mulai","Selesai","Status"],...filtered().map(s=>[s.id,s.date,s.className||classes[s.classId]||s.classId,s.subject,s.teacher,s.sumatifNumber,s.assessmentType,s.startTime,s.endTime,s.status])];const blob=new Blob(["\ufeff"+rows.map(row=>row.map(csvEscape).join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="sumatif-planner-laporan.csv";a.click();URL.revokeObjectURL(url)};$("print").onclick=()=>window.print();["search","status","type"].forEach(id=>$(id).addEventListener(id==="search"?"input":"change",render));window.addEventListener("load",load)})();
</script></body></html>
