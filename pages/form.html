<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form Jadwal</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#18243b;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;padding:14px}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,.8fr);gap:14px}.panel{background:#fff;border:1px solid #e1e8f2;border-radius:14px;padding:18px}.panel h3{margin:0 0 14px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.wide{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#53637d}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #d6dfed;border-radius:9px;font:inherit;background:#fff;color:#18243b}.actions{display:flex;gap:8px;margin-top:16px}.actions button{border:0;border-radius:9px;padding:11px 13px;font:inherit;font-weight:700;cursor:pointer}.primary{background:#315bd6;color:white}.secondary{background:#e9eef8;color:#263b68}.rule{padding:10px;border-radius:9px;background:#f6f8fb;margin:8px 0;font-size:13px}.rule.good{background:#eaf8ef;color:#166534}.rule.bad{background:#fff0ef;color:#a22929}.result{margin-top:12px;padding:12px;border-radius:10px;background:#f7f9fc;font-size:13px;white-space:pre-wrap}.notice{font-size:12px;color:#697890;line-height:1.55}@media(max-width:740px){.layout{grid-template-columns:1fr}}@media(max-width:470px){.fields{grid-template-columns:1fr}.field.wide{grid-column:auto}}
</style></head><body><div class="layout"><section class="panel"><h3>Jadwalkan Sumatif</h3><form id="scheduleForm"><div class="fields">
<div class="field"><label for="academic-year-select">Tahun pelajaran</label><select id="academic-year-select"><option value="2026/2027">2026/2027</option></select></div>
<div class="field"><label for="semester-select">Semester</label><select id="semester-select"><option value="1">Ganjil</option><option value="2">Genap</option></select></div>
<div class="field"><label for="class-select">Kelas</label><select id="class-select"><option value="class-5a">Kelas 5-A</option><option value="class-5b">Kelas 5-B</option><option value="class-3a">Kelas 3-A</option><option value="class-4b">Kelas 4-B</option></select></div>
<div class="field"><label for="subject-select">Mata pelajaran</label><select id="subject-select"><option value="ipas">IPAS</option><option value="bahasa-indonesia">Bahasa Indonesia</option><option value="matematika">Matematika</option><option value="pjok">PJOK</option><option value="seni-rupa">Seni Rupa &amp; Prakarya</option></select></div>
<div class="field"><label for="teacher-select">Guru</label><select id="teacher-select"><option value="teacher-ahmad">Ahmad Faisal, S.Pd.</option><option value="teacher-nurjanah">Dra. Hj. Nurjanah</option><option value="teacher-rudi">Rudi Hartono, S.Pd.</option><option value="teacher-indah">Indah Lestari, S.Pd.</option></select></div>
<div class="field"><label for="sumatif-number">Nomor sumatif</label><select id="sumatif-number"><option value="1">Sumatif 1</option><option value="2">Sumatif 2</option><option value="3">Sumatif 3</option></select></div>
<div class="field"><label for="input-assessment-date">Tanggal</label><input id="input-assessment-date" type="date" required></div>
<div class="field"><label for="modality">Jenis asesmen</label><select id="modality"><option value="written">Tertulis</option><option value="practical">Praktik</option></select></div>
<div class="field"><label for="input-start-time">Waktu mulai</label><input id="input-start-time" type="time" value="07:30"></div>
<div class="field"><label for="input-end-time">Waktu selesai</label><input id="input-end-time" type="time" value="08:30"></div>
<div class="field"><label for="room-input">Ruang</label><input id="room-input" value="Ruang Kelas 5-A"></div>
<div class="field wide"><label for="topic-input">Materi / topik</label><textarea id="topic-input" rows="2" placeholder="Tuliskan materi yang diujikan" required></textarea></div>
</div><div class="actions"><button class="primary" type="submit">Validasi &amp; simpan ke sesi demo</button><button class="secondary" type="reset">Reset form</button></div></form><div id="result" class="result">Isi form lalu jalankan validasi.</div></section><aside class="panel"><h3>Aturan bisnis</h3><div id="rules"></div><p class="notice">Ini prototipe. Jadwal disimpan dalam memori sesi, bukan ke database. Refresh halaman akan mereset data demo. Tidak tersedia autentikasi produksi.</p></aside></div>
<script>
(()=>{const ns="ZIESORRA_SUMATIF_BRIDGE",pending=new Map();let seq=0;const $=id=>document.getElementById(id);let subjects={ipas:"IPAS","bahasa-indonesia":"Bahasa Indonesia",matematika:"Matematika",pjok:"PJOK","seni-rupa":"Seni Rupa & Prakarya"};let teachers={"teacher-ahmad":"Ahmad Faisal, S.Pd.","teacher-nurjanah":"Dra. Hj. Nurjanah","teacher-rudi":"Rudi Hartono, S.Pd.","teacher-indah":"Indah Lestari, S.Pd."};let classes={"class-5a":"Kelas 5-A","class-5b":"Kelas 5-B","class-3a":"Kelas 3-A","class-4b":"Kelas 4-B"};let assignments=[{classId:"class-5a",subjectId:"ipas",teacherId:"teacher-ahmad"},{classId:"class-5a",subjectId:"bahasa-indonesia",teacherId:"teacher-ahmad"},{classId:"class-5a",subjectId:"matematika",teacherId:"teacher-ahmad"},{classId:"class-3a",subjectId:"bahasa-indonesia",teacherId:"teacher-nurjanah"},{classId:"class-5b",subjectId:"pjok",teacherId:"teacher-rudi"},{classId:"class-4b",subjectId:"seni-rupa",teacherId:"teacher-indah"}];let records=[],authMode="demo",signedInProfile=null,referenceData=null;function request(type,payload={}){return new Promise(resolve=>{const id="form-"+(++seq);pending.set(id,resolve);parent.postMessage({namespace:ns,type,requestId:id,payload},location.origin);setTimeout(()=>{if(pending.has(id)){pending.delete(id);resolve({ok:false,error:"Bridge timeout"})}},2500)})}window.addEventListener("message",e=>{if(e.origin!==location.origin||e.source!==parent)return;const m=e.data;if(!m||m.namespace!==ns)return;if(m.type==="RESPONSE"&&m.payload?.requestId){pending.get(m.payload.requestId)?.(m.payload.result);pending.delete(m.payload.requestId)}if(m.type==="STORE_CHANGED"){records=m.payload?.schedules||records;}});function setOptions(select,items,selected){select.replaceChildren();items.forEach(item=>{const option=document.createElement("option");option.value=item.value;option.textContent=item.label;select.append(option)});if(items.some(item=>item.value===selected))select.value=selected;}function refreshSubjects(preferred){const classId=$("class-select").value,yearId=$("academic-year-select").value;const rows=assignments.filter(a=>a.classId===classId&&(authMode!=="supabase"||a.academicYearId===yearId));const ids=[...new Set(rows.map(a=>a.subjectId))];setOptions($("subject-select"),ids.map(id=>({value:id,label:subjects[id]})),preferred||$("subject-select").value);refreshTeachers();}function refreshTeachers(){const classId=$("class-select").value,subjectId=$("subject-select").value,yearId=$("academic-year-select").value;const ids=[...new Set(assignments.filter(a=>a.classId===classId&&a.subjectId===subjectId&&(authMode!=="supabase"||a.academicYearId===yearId)).map(a=>a.teacherId))];setOptions($("teacher-select"),ids.map(id=>({value:id,label:teachers[id]})),$("teacher-select").value);} $("class-select").addEventListener("change",()=>refreshSubjects());$("subject-select").addEventListener("change",refreshTeachers);refreshSubjects("ipas");function candidate(){const classId=$("class-select").value,subjectId=$("subject-select").value,teacherId=authMode==="supabase"&&signedInProfile?.role==="teacher"?signedInProfile.authUserId:$("teacher-select").value;const common={semester:Number($("semester-select").value),classId,subjectId,subject:subjects[subjectId],teacherId,teacher:teachers[teacherId]||signedInProfile?.full_name,sumatifNumber:Number($("sumatif-number").value),date:$("input-assessment-date").value,startTime:$("input-start-time").value,endTime:$("input-end-time").value,assessmentType:$("modality").value,room:$("room-input").value,material:$("topic-input").value,status:"scheduled"};return authMode==="supabase"?{...common,academicYearId:$("academic-year-select").value}: {...common,academicYear:$("academic-year-select").value}}function showValidation(v){const root=$("rules");root.replaceChildren();(v?.checks||[]).forEach(c=>{const el=document.createElement("div");el.className="rule "+(c.passed?"good":"bad");el.textContent=(c.passed?"✓ ":"✕ ")+c.label+(c.message?" — "+c.message:"");root.append(el)});if(!(v?.checks||[]).length)root.textContent="Hasil validasi belum tersedia."} $("scheduleForm").addEventListener("submit",async e=>{e.preventDefault();$("result").textContent="Memvalidasi jadwal…";const c=candidate();const check=await request("VALIDATE_SCHEDULE",{candidate:c});showValidation(check.validation);if(!check.validation?.valid){$("result").textContent="Jadwal ditolak. Perbaiki aturan yang gagal lalu coba lagi.";return}const saved=await request("SAVE_SCHEDULE",{candidate:c});if(!saved.ok){showValidation(saved.validation);$("result").textContent="Jadwal tidak tersimpan:\n"+(saved.errors||[saved.error||"Validasi gagal"]).map(x=>typeof x==="string"?x:x.message).join("\n");return}$("result").textContent="Jadwal tersimpan pada store memori untuk sesi ini. ID: "+saved.record.id;});async function initDatabaseForm(){
 const auth=await request("GET_AUTH_STATUS");
 if(!auth.ok||auth.mode!=="supabase")return;
 authMode="supabase";signedInProfile=auth.profile;
 const ref=await request("GET_REFERENCE_DATA");
 if(!ref.ok||!ref.referenceData){$("result").textContent="Gagal memuat data referensi: "+(ref.error||"tidak ada data");return;}
 referenceData=ref.referenceData;
 const years=referenceData.academicYears||[],activeYear=years.find(y=>y.is_active)||years[0];
 if(activeYear)setOptions($("academic-year-select"),years.map(y=>({value:y.id,label:y.name})),activeYear.id);
 classes=Object.fromEntries((referenceData.classes||[]).map(x=>[x.id,x.name]));
 subjects=Object.fromEntries((referenceData.subjects||[]).map(x=>[x.id,x.name]));
 assignments=(referenceData.assignments||[]).map(x=>({academicYearId:x.academic_year_id,teacherId:x.teacher_id,classId:x.class_id,subjectId:x.subject_id,active:x.is_active,academicYear:years.find(y=>y.id===x.academic_year_id)?.name}));
 teachers=Object.fromEntries((referenceData.teachers||[]).map(t=>[t.id,t.full_name]));
 const yearSelect=$("academic-year-select");
 function refreshClassOptions(preferred){
  const yearId=yearSelect.value;
  const assignedClassIds=new Set(assignments.filter(a=>a.academicYearId===yearId).map(a=>a.classId));
  const available=(referenceData.classes||[]).filter(x=>assignedClassIds.has(x.id));
  setOptions($("class-select"),available.map(x=>({value:x.id,label:x.name})),preferred||$("class-select").value);
  refreshSubjects();
 }
 yearSelect.addEventListener("change",()=>refreshClassOptions());
 refreshClassOptions();
 if(signedInProfile.role==="teacher"){
  $("teacher-select").value=signedInProfile.authUserId;
  $("teacher-select").disabled=true;
 }else{
  $("teacher-select").disabled=false;
 }
 const availablePeriods=(referenceData.assessmentPeriods||[]).filter(p=>p.academic_year_id===yearSelect.value);
 if(availablePeriods.length){
  setOptions($("semester-select"),[...new Set(availablePeriods.map(p=>p.semester))].map(s=>({value:String(s),label:s===1?"Ganjil":"Genap"})),String(availablePeriods[0].semester));
 }
 $("scheduleForm").querySelector('button[type="submit"]').textContent="Validasi & simpan ke database";
 const note=document.querySelector(".notice");if(note)note.textContent="Mode Supabase aktif. Aturan final diperiksa oleh database saat penyimpanan.";
 const list=await request("GET_SCHEDULES");if(list.ok)records=list.schedules||[];
}
window.addEventListener("load",async()=>{await initDatabaseForm();if(authMode==="demo"){const r=await request("GET_SCHEDULES");if(r.ok)records=r.schedules||[];}});
})();
</script></body></html>
