<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kalender Sumatif</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#18243b;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;padding:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar select,.toolbar button{padding:9px 11px;border:1px solid #dce4f0;border-radius:9px;background:#fff;color:inherit;font:inherit}.layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(260px,.7fr);gap:14px}.panel{background:white;border:1px solid #e1e8f2;border-radius:14px;padding:16px}.month-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.month-head h3{margin:0}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.dow,.day{padding:6px 3px;border-radius:8px;text-align:center;font-size:12px}.dow{color:#6a7991;font-weight:700}.day{min-height:70px;background:#f7f9fc;text-align:left}.day .n{font-weight:700}.event{display:block;margin-top:5px;padding:4px 3px;border-radius:5px;background:#dbeafe;color:#1e429f;overflow-wrap:anywhere;font-size:10px}.event.practical{background:#dcfce7;color:#166534}.event.cancelled{background:#f1f5f9;color:#6b7280;text-decoration:line-through}.list{display:grid;gap:8px}.item{border:1px solid #e6ebf3;border-radius:10px;padding:10px;cursor:pointer}.item strong{display:block;font-size:13px}.item small{display:block;color:#697890;margin-top:5px}.notice{font-size:12px;color:#697890;line-height:1.55;margin-top:12px}@media(max-width:760px){.layout{grid-template-columns:1fr}.day{min-height:58px}.event{font-size:9px}}
</style></head><body>
<div class="toolbar"><select id="classFilter"><option value="ALL">Semua kelas</option></select><select id="statusFilter"><option value="ALL">Semua status</option><option value="scheduled">Terjadwal</option><option value="cancelled">Dibatalkan</option></select><button id="prev">← Bulan sebelumnya</button><button id="next">Bulan berikutnya →</button></div>
<div class="layout"><section class="panel"><div class="month-head"><h3 id="monthTitle">Oktober 2026</h3><span id="count"></span></div><div class="grid" id="calendar"></div><p class="notice">Klik jadwal di daftar sebelah untuk melihat detail. Jadwal demo berada di memori sesi.</p></section><section class="panel"><h3 style="margin-top:0">Daftar jadwal</h3><div id="list" class="list"></div><p class="notice">Status database hanya <code>scheduled</code> atau <code>cancelled</code>. Validasi adalah hasil turunan dari aturan domain.</p></section></div>
<script>
(()=>{const ns="ZIESORRA_SUMATIF_BRIDGE",pending=new Map();let seq=0,records=[],month=new Date(2026,9,1);const $=id=>document.getElementById(id);const fmt=d=>d.toISOString().slice(0,10);const classNames={"class-1a":"Kelas 1-A","class-2a":"Kelas 2-A","class-3a":"Kelas 3-A","class-4a":"Kelas 4-A","class-4b":"Kelas 4-B","class-5a":"Kelas 5-A","class-5b":"Kelas 5-B","class-6a":"Kelas 6-A","class-6b":"Kelas 6-B"};function req(type,payload={}){return new Promise(resolve=>{const id="cal-"+(++seq);pending.set(id,resolve);parent.postMessage({namespace:ns,type,requestId:id,payload},location.origin);setTimeout(()=>{if(pending.has(id)){pending.delete(id);resolve({ok:false})}},2500)})}window.addEventListener("message",e=>{if(e.origin!==location.origin||e.source!==parent)return;const m=e.data;if(!m||m.namespace!==ns)return;if(m.type==="RESPONSE"&&m.payload?.requestId){pending.get(m.payload.requestId)?.(m.payload.result);pending.delete(m.payload.requestId)}if(m.type==="STORE_CHANGED")load()});async function load(){const r=await req("GET_SCHEDULES");if(r.ok){records=r.schedules||[];fillFilter();render()}}function fillFilter(){const select=$("classFilter"),old=select.value;const names=[...new Set(records.map(s=>s.classId))];select.innerHTML='<option value="ALL">Semua kelas</option>'+names.map(n=>'<option value="'+n+'">'+(classNames[n]||n)+'</option>').join("");select.value=names.includes(old)?old:"ALL"}function filtered(){return records.filter(s=>($("classFilter").value==="ALL"||s.classId===$("classFilter").value)&&($("statusFilter").value==="ALL"||s.status===$("statusFilter").value))}function render(){const year=month.getFullYear(),m=month.getMonth();$("monthTitle").textContent=month.toLocaleDateString("id-ID",{month:"long",year:"numeric"});const grid=$("calendar");grid.replaceChildren();["Sen","Sel","Rab","Kam","Jum","Sab","Min"].forEach(d=>{const el=document.createElement("div");el.className="dow";el.textContent=d;grid.append(el)});let offset=(new Date(year,m,1).getDay()+6)%7;for(let i=0;i<offset;i++){const el=document.createElement("div");grid.append(el)}const total=new Date(year,m+1,0).getDate();for(let d=1;d<=total;d++){const date=year+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");const el=document.createElement("div");el.className="day";const n=document.createElement("div");n.className="n";n.textContent=d;el.append(n);filtered().filter(s=>s.date===date).forEach(s=>{const ev=document.createElement("span");ev.className="event "+(s.status==="cancelled"?"cancelled":s.assessmentType==="practical"?"practical":"");ev.textContent=(s.subject||"Asesmen")+" · "+(s.className||classNames[s.classId]||s.classId);ev.title=s.teacher||"";el.append(ev)});grid.append(el)}const list=$("list");list.replaceChildren();const rows=filtered().sort((a,b)=>a.date.localeCompare(b.date));$("count").textContent=rows.length+" jadwal";if(!rows.length){list.textContent="Tidak ada jadwal dengan filter ini.";return}rows.forEach(s=>{const it=document.createElement("div");it.className="item";const strong=document.createElement("strong");strong.textContent=s.date+" · "+(s.className||classNames[s.classId]||s.classId)+" · "+s.subject;const small=document.createElement("small");small.textContent=(s.startTime||"")+(s.endTime?"–"+s.endTime:"")+" · "+s.teacher+" · "+s.assessmentType+" · "+s.status;it.append(strong,small);list.append(it)})}$("prev").onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);render()};$("next").onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);render()};$("classFilter").onchange=render;$("statusFilter").onchange=render;window.syncSchedulesFromSharedStore=rows=>{records=rows||[];fillFilter();render()};window.addEventListener("load",load)})();
</script></body></html>
